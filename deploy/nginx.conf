# ============================================================
# nginx для «Аура красоты»: статика + прокси на Go-бэкенд
# Файл монтируется в контейнер nginx (см. docker-compose.yml)
# ============================================================

server {
    listen 80;
    server_name _;

    # фронтенд (каталог frontend/ монтируется в /var/www/aura)
    root /var/www/aura;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # кэш статики с ассетами
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API и загруженные фото — на Go-сервер
    location /api/ {
        proxy_pass http://web:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 12m;
    }

    location /uploads/ {
        proxy_pass http://web:8080;
        proxy_set_header Host $host;
    }

    # страницы сайта
    location / {
        try_files $uri $uri/ /index.html;
    }
}
