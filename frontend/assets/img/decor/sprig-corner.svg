    <!-- маленький цветок -->
    <g transform="translate(88 196) rotate(-18)">
      <circle r="4" fill="#F0AFC5"/>
      <g fill="#FBDCE8">
        <ellipse rx="4.5" ry="10" transform="rotate(0) translate(0 -12)"/>
        <ellipse rx="4.5" ry="10" transform="rotate(72) translate(0 -12)"/>
        <ellipse rx="4.5" ry="10" transform="rotate(144) translate(0 -12)"/>
        <ellipse rx="4.5" ry="10" transform="rotate(216) translate(0 -12)"/>
        <ellipse rx="4.5" ry="10" transform="rotate(288) translate(0 -12)"/>
      </g>
    </g>
    <!-- бутон -->
    <g transform="translate(236 58) rotate(24)">
      <path d="M0 0 C-9 -6 -10 -20 0 -26 C10 -20 9 -6 0 0 Z" fill="#F7CFDE"/>
      <path d="M0 -24 C0 -16 0 -8 0 0" stroke-width="1.6"/>
    </g>
    <!-- листья -->
    <path d="M118 226 C104 214 88 214 78 224 C88 236 106 236 118 226 Z" fill="#FBDCE8"/>
    <path d="M132 186 C144 172 160 168 172 176 C164 190 146 194 132 186 Z" fill="#F7CFDE"/>
    <path d="M204 118 C194 106 180 104 170 112 C178 124 194 126 204 118 Z" fill="#FBDCE8"/>
    <!-- точки-акценты -->
    <g fill="#E9A9BE" stroke="none">
      <circle cx="64" cy="262" r="3.4"/>
      <circle cx="270" cy="140" r="3"/>
      <circle cx="296" cy="96" r="2.2"/>
      <circle cx="196" cy="172" r="2.6"/>
    </g>
