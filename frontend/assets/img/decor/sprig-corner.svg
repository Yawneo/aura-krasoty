<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <!-- Декоративная веточка с цветами «от руки» для углов секций -->
  <g stroke="#E9A9BE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 310 C90 260 130 210 160 150 C186 98 210 60 268 28" stroke-width="2.6"/>
    <!-- большой цветок -->
    <g transform="translate(160 96) rotate(12)">
      <path d="M0 -8 C-7 -20 -5.5 -36 1 -41 C7.5 -35 8.5 -19 1.6 -8 C1 -7 0.6 -7 0 -8 Z" fill="#FBE3EC" transform="rotate(0)"/>
      <path d="M0 -8 C-7 -20 -5.5 -36 1 -41 C7.5 -35 8.5 -19 1.6 -8 C1 -7 0.6 -7 0 -8 Z" fill="#F7CFDE" transform="rotate(72)"/>
      <path d="M0 -8 C-7 -20 -5.5 -36 1 -41 C7.5 -35 8.5 -19 1.6 -8 C1 -7 0.6 -7 0 -8 Z" fill="#FBE3EC" transform="rotate(144)"/>
      <path d="M0 -8 C-7 -20 -5.5 -36 1 -41 C7.5 -35 8.5 -19 1.6 -8 C1 -7 0.6 -7 0 -8 Z" fill="#F7CFDE" transform="rotate(216)"/>
      <path d="M0 -8 C-7 -20 -5.5 -36 1 -41 C7.5 -35 8.5 -19 1.6 -8 C1 -7 0.6 -7 0 -8 Z" fill="#FDF0F5" transform="rotate(288)"/>
