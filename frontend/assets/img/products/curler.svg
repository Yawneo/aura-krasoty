<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBEFF3"/><stop offset="1" stop-color="#F3DDE7"/></linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8A5066"/><stop offset="1" stop-color="#612F44"/></linearGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDF3F7"/><stop offset="1" stop-color="#E3BCCB"/></linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C98BA2"/><stop offset="1" stop-color="#D9A1B6"/></linearGradient>
  </defs>
  <circle cx="240" cy="240" r="196" fill="url(#bg)"/>
  <ellipse cx="240" cy="398" rx="126" ry="17" fill="#D9A1B6" opacity="0.35"/>
  <g stroke="#7A3F56" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="rotate(22 240 240)">
    <!-- рукоятка -->
    <rect x="96" y="216" width="112" height="58" rx="24" fill="url(#handle)"/>
    <path d="M132 216 c-5-14 4-26 20-26 16 0 25 12 20 26" fill="none"/>
    <!-- шарнир -->
    <circle cx="216" cy="245" r="16" fill="#D9A1B6"/>
    <!-- барабан плойки -->
    <rect x="228" y="222" width="136" height="46" rx="21" fill="url(#barrel)"/>
    <!-- кончик -->
    <path d="M364 222 c28 3 44 12 44 23 s-16 20-44 23 Z" fill="url(#tip)"/>
    <!-- держатель-подставка -->
    <path d="M248 268 v20 M276 268 v20 M304 268 v20 M332 268 v20" stroke-width="6" opacity="0.6"/>
    <!-- кнопка -->
    <circle cx="152" cy="245" r="9" fill="#D9A1B6"/>
    <!-- пар -->
    <g stroke-width="5" opacity="0.7">
      <path d="M330 150 c6-12 20-14 30-6 M352 122 c2-10 12-14 21-11"/>
    </g>
  </g>
</svg>
