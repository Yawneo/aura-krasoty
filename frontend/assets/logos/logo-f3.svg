  </defs>
  <circle cx="32" cy="32" r="27" stroke="url(#ring)" stroke-width="3.4"/>
  <circle cx="32" cy="32" r="22.5" stroke="#F9C6A0" stroke-width="1" opacity="0.8"/>
  <g stroke="#C2557B" stroke-width="1" stroke-linecap="round">
    <path id="q" d="M32 35 C27.5 30 28 21.5 32 16 C36 21.5 36.5 30 32 35 Z" fill="url(#lp)" transform="rotate(0 32 35)"/>
    <use href="#q" transform="rotate(72 32 35)"/>
    <use href="#q" transform="rotate(144 32 35)"/>
    <use href="#q" transform="rotate(216 32 35)"/>
    <use href="#q" transform="rotate(288 32 35)"/>
    <circle cx="32" cy="35" r="4.6" fill="url(#cen)"/>
    <circle cx="30.6" cy="33.6" r="1.2" fill="#FFF3D6"/>
