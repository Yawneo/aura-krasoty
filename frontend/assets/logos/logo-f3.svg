  <!-- цветные бусины по кольцу -->
  <circle cx="32" cy="7" r="1.9" fill="#F49BB8"/>
  <circle cx="55" cy="27" r="1.7" fill="#B79CD4"/>
  <circle cx="46" cy="54" r="1.7" fill="#F9C6A0"/>
  <circle cx="18" cy="54" r="1.7" fill="#9CC794"/>
  <circle cx="9" cy="27" r="1.7" fill="#DFA648"/>
