<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Е · 3: «Цветная печать» — градиентное кольцо, в центре сочный цветок -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F49BB8"/><stop offset="0.5" stop-color="#F9C6A0"/><stop offset="1" stop-color="#B79CD4"/>
    </linearGradient>
    <radialGradient id="cen" cx="0.4" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#F6D488"/><stop offset="1" stop-color="#E89B5C"/>
    </radialGradient>
    <linearGradient id="lp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBC0D4"/><stop offset="1" stop-color="#E9698F"/>
